[sftp]
host = sftp.example.com
port = 22
username = your_username
password = your_password
remote_directory = /upload

[watch]
source_directory = C:\ProgramData\Sage\Communication\Recus
file_pattern = *.txt
poll_interval = 30
archive_directory = C:\ProgramData\Sage\Communication\Recus\archive

[logging]
log_directory = C:\ProgramData\SFTPService\logs
log_level = INFO
log_retention_days = 90

[alerts]
enabled = false
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_use_tls = true
smtp_username = 
smtp_password = 
from_email = 
to_emails = 
subject_prefix = [ALERTE SFTP]

[retry]
max_retries = 3
retry_delay = 60
